[package]
name = "sindri"
version = "0.1.0"
edition = "2024"
description = "Sindri"

[dependencies]
blake3 = "1"
clap = { version = "4.6.0", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
miette = { version = "7.6.0", features = ["fancy"] }
nickel-lang = "2.0.0"
nickel-lang-core = { version = "0.17.0", default-features = false }
rmp-serde = "1"
serde = { version = "1.0.228", features = ["derive"] }
smol_str = { version = "0.2", features = ["serde"] }
serde_json = "1"
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["local-offset"] }

[dev-dependencies]
serde_json = "1"
tempfile = "3.27.0"

[lints.clippy]
# Sindri is a binary, not a library: a no-argument `new()` needs no companion `Default`, since
# there is no external consumer or generic `Default`-bounded code to satisfy.
new_without_default = "allow"
# The explicit nested `if` / `if let` form reads more clearly than collapsing the conditions into a
# single `&&` (or let-chain), so keep the nesting rather than flattening it.
collapsible_if = "allow"
