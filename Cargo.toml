[package]
name = "sindri"
version = "0.1.0"
edition = "2024"
description = "Sindri"

[dependencies]
clap = { version = "4.6.0", features = ["derive"] }
miette = { version = "7.6.0", features = ["fancy"] }
nickel-lang = "2.0.0"
serde = { version = "1.0.228", features = ["derive"] }
smol_str = { version = "0.2", features = ["serde"] }
thiserror = "2.0.18"
time = { version = "0.3.47", features = ["local-offset"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", default-features = false, features = ["fmt", "std"] }

[dev-dependencies]
tempfile = "3.27.0"

[lints.clippy]
# Sindri is a binary, not a library: a no-argument `new()` needs no companion `Default`, since
# there is no external consumer or generic `Default`-bounded code to satisfy.
new_without_default = "allow"
# The explicit nested `if` / `if let` form reads more clearly than collapsing the conditions into a
# single `&&` (or let-chain), so keep the nesting rather than flattening it.
collapsible_if = "allow"
